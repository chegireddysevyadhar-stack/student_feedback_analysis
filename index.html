<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSense - Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#f6f8ff;color:#1e293b}header{background:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 15px rgba(0,0,0,.05);position:sticky;top:0} .logo{font-weight:700;font-size:22px;color:#4f46e5} .logo span{color:#06b6d4} nav a{margin-left:20px;text-decoration:none;color:#475569;font-weight:600} .hero{background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;padding:70px 5%;text-align:center} .hero h1{font-size:42px} .container{max-width:900px;margin:-40px auto 50px;background:#fff;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,.08);padding:35px} label{font-weight:600;margin-top:18px;display:block;margin-bottom:6px} select,input,textarea{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:15px} .question-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin:14px 0} .q-text{font-weight:600;margin-bottom:10px} .stars{display:flex;gap:8px} .stars label{cursor:pointer;font-size:22px;color:#cbd5e1;margin:0} .stars input{display:none} .btn{background:#4f46e5;color:#fff;border:none;padding:14px 28px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:25px} .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:30px 0} .stat{background:#f8fafc;padding:18px;border-radius:12px;text-align:center;border:1px solid #e2e8f0} .stat h3{font-size:28px;color:#4f46e5} footer{text-align:center;padding:25px;color:#94a3b8}</style>
</head><body>
<header><div class="logo">EduSense <span>Feedback</span></div><nav><a href="index.html">Form</a><a href="dashboard.html">Dashboard</a></nav></header>
<div class="hero"><h1>Course Feedback Form</h1><p>Your honest feedback helps us improve teaching quality</p></div>
<div class="container">
<label>Select Course *</label><select id="course"><option value="">-- Choose Course --</option><option>Python Programming</option><option>Data Structures</option><option>Machine Learning</option><option>Web Development</option><option>Database Management</option><option>Artificial Intelligence</option></select>
<label>Your Name (Optional)</label><input type="text" id="studentName" placeholder="Anonymous if left blank">
<div id="questions"></div>
<label>Optional Comments</label><textarea id="comments" rows="4" placeholder="Share any extra suggestions..."></textarea>
<button class="btn" onclick="submitFeedback()">Submit Feedback</button>
<div class="stats"><div class="stat"><h3 id="totalCount">0</h3><p>Total Feedbacks</p></div><div class="stat"><h3>4.8/5</h3><p>Avg Rating</p></div><div class="stat"><h3>100%</h3><p>Anonymous</p></div></div>
</div>
<footer>© 2026 EduSense - Works on GitHub Pages</footer>
<script>
const questionsList=[{section:"Course Content",qs:["Course content was well organized","Syllabus covered relevant topics","Learning materials were helpful"]},{section:"Teaching Quality",qs:["Instructor explained clearly","Encouraged participation","Doubts cleared effectively"]},{section:"Overall Experience",qs:["Course improved my knowledge","I would recommend this course","Overall satisfaction"]}];
function loadQuestions(){let html="";questionsList.forEach((sec,secIdx)=>{html+=`<h3 style='margin-top:25px;color:#4f46e5'>${sec.section}</h3>`;sec.qs.forEach((q,qIdx)=>{let qId=`q_${secIdx}_${qIdx}`;html+=`<div class="question-card"><div class="q-text">${q}</div><div class="stars">`;for(let i=1;i<=5;i++){html+=`<label><input type="radio" name="${qId}" value="${i}"><span>★</span></label>`}html+=`</div></div>`})});document.getElementById("questions").innerHTML=html;document.querySelectorAll(".stars").forEach(g=>{g.querySelectorAll("label").forEach((l,idx)=>{l.addEventListener("click",()=>{g.querySelectorAll("span").forEach((s,i)=>s.style.color=i<=idx?"#f59e0b":"#cbd5e1")})})})}
function submitFeedback(){const course=document.getElementById("course").value;if(!course){alert("Please select course!");return}let answers=[];let incomplete=false;questionsList.forEach((sec,secIdx)=>{sec.qs.forEach((q,qIdx)=>{let qId=`q_${secIdx}_${qIdx}`;let val=document.querySelector(`input[name="${qId}"]:checked`);if(!val)incomplete=true;else answers.push({question:q,rating:parseInt(val.value)})})});if(incomplete){alert("Please rate all questions!");return}const data={course,student:document.getElementById("studentName").value||"Anonymous",comments:document.getElementById("comments").value,answers,date:new Date().toLocaleString(),avg:(answers.reduce((a,b)=>a+b.rating,0)/answers.length).toFixed(1)};let all=JSON.parse(localStorage.getItem("feedbacks")||"[]");all.push(data);localStorage.setItem("feedbacks",JSON.stringify(all));window.location.href="success.html"}function updateCount(){let all=JSON.parse(localStorage.getItem("feedbacks")||"[]");document.getElementById("totalCount").textContent=all.length}loadQuestions();updateCount();
</script></body></html>
