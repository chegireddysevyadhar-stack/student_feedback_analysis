<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#f6f8ff;padding:20px}header{background:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-radius:12px;box-shadow:0 2px 15px rgba(0,0,0,.05);margin-bottom:25px}.logo{font-weight:700;font-size:22px;color:#4f46e5}.logo span{color:#06b6d4}nav a{margin-left:20px;text-decoration:none;color:#475569;font-weight:600}.container{max-width:1100px;margin:0 auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px}.stat{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:center}.stat h3{font-size:32px;color:#4f46e5}.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:20px}.feedback-item{border:1px solid #e2e8f0;border-radius:10px;padding:15px;margin:12px 0;background:#f8fafc}.badge{background:#4f46e5;color:white;padding:3px 10px;border-radius:20px;font-size:12px}.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600}.btn-del{background:#fee2e2;color:#dc2626}</style></head><body><header><div class="logo">EduSense <span>Dashboard</span></div><nav><a href="index.html">Form</a><a href="dashboard.html">Dashboard</a></nav></header><div class="container"><div class="stats"><div class="stat"><h3 id="total">0</h3><p>Total</p></div><div class="stat"><h3 id="avg">0</h3><p>Average</p></div><div class="stat"><h3 id="courses">0</h3><p>Courses</p></div></div><div class="card"><h2>Recent Feedbacks</h2><div id="list"></div><button onclick="clearAll()" class="btn btn-del" style="margin-top:15px">Clear All Data</button></div></div><script>function load(){let all=JSON.parse(localStorage.getItem("feedbacks")||"[]");document.getElementById("total").textContent=all.length;let avg=0;if(all.length){avg=(all.reduce((a,b)=>a+parseFloat(b.avg),0)/all.length).toFixed(1)}document.getElementById("avg").textContent=avg;let courseSet=new Set(all.map(f=>f.course));document.getElementById("courses").textContent=courseSet.size;let html="";if(all.length==0)html="<p style='color:#64748b;margin-top:15px'>No feedbacks yet.</p>";else{all.slice().reverse().forEach(f=>{html+=`<div class="feedback-item"><span class="badge">${f.course}</span> <strong>${f.student}</strong> - ⭐ ${f.avg}/5 <small style="color:#64748b">(${f.date})</small><br><small>${f.comments||'No comments'}</small></div>`})}document.getElementById("list").innerHTML=html}function clearAll(){if(confirm("Delete all?")){localStorage.removeItem("feedbacks");load()}}load();</script></body></html>
